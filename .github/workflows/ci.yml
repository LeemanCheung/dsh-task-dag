name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify committed Host and browser bundles
        run: |
          git diff --exit-code -- lib/index.js lib/reasoning-defaults.js lib/client.js
          test -z "$(git ls-files --others --exclude-standard -- lib)"
