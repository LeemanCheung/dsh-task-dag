<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">dsh-task-dag projection architecture</title>
  <desc id="desc">Session state, durable Agent Teams events, and Workflow Conversation Nodes flow through browser projections into a multi-edge graph model and three DSH Web views.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4.5 0 9Z" fill="#58616d"/></marker>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#30353d"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity=".18"/></filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .card { fill:#1a1d22; stroke:#343941; stroke-width:1.2; }
      .title { fill:#f4f6f8; font-size:14px; font-weight:650; }
      .meta { fill:#9da5af; font-size:11px; }
      .eyebrow { fill:#7f9cff; font-size:9px; font-weight:750; letter-spacing:1.1px; }
      .arrow { fill:none; stroke:#58616d; stroke-width:1.6; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="428" rx="18" fill="#111318" stroke="#343941"/>
  <rect x="1" y="1" width="1198" height="428" rx="18" fill="url(#dots)" opacity=".52"/>
  <text x="38" y="42" fill="#f4f6f8" font-size="18" font-weight="700">Projection-driven, client-only architecture</text>
  <text x="38" y="63" class="meta">Durable DSH state in, owned graph model out. No Host RPC, polling, or persisted mirror.</text>

  <path class="arrow" marker-end="url(#arrow)" d="M278 127H348"/>
  <path class="arrow" marker-end="url(#arrow)" d="M278 235H322C336 235 336 201 348 201"/>
  <path class="arrow" marker-end="url(#arrow)" d="M278 343H322C336 343 336 273 348 273"/>
  <path class="arrow" marker-end="url(#arrow)" d="M574 201H642"/>
  <path class="arrow" marker-end="url(#arrow)" d="M884 201H946"/>

  <g filter="url(#shadow)"><rect class="card" x="38" y="91" width="240" height="72" rx="12"/><rect x="53" y="106" width="40" height="40" rx="10" fill="#272c33"/><path d="M63 117h20M63 125h20M63 133h13" stroke="#9da5af" stroke-width="1.6" stroke-linecap="round"/><text x="107" y="116" class="eyebrow">SESSION LIST</text><text x="107" y="138" class="title">Lineage and activity</text><text x="107" y="154" class="meta">byId · parentId · catalogs</text></g>

  <g filter="url(#shadow)"><rect class="card" x="38" y="199" width="240" height="72" rx="12"/><rect x="53" y="214" width="40" height="40" rx="10" fill="#2d3228"/><path d="M63 224h20M63 232h14M63 240h10" stroke="#d7a33d" stroke-width="1.7" stroke-linecap="round"/><text x="107" y="224" class="eyebrow" fill="#d7a33d">TEAM EVENTS V1</text><text x="107" y="246" class="title">Tasks and messages</text><text x="107" y="262" class="meta">member · task · queued · delivered</text></g>

  <g filter="url(#shadow)"><rect class="card" x="38" y="307" width="240" height="72" rx="12"/><rect x="53" y="322" width="40" height="40" rx="10" fill="#252d45"/><path d="M73 328v9M63 352v-9h20v9" fill="none" stroke="#7f9cff" stroke-width="1.7" stroke-linecap="round"/><circle cx="73" cy="328" r="3" fill="none" stroke="#7f9cff" stroke-width="1.6"/><text x="107" y="332" class="eyebrow">WORKFLOW NODES</text><text x="107" y="354" class="title">Runs and phase groups</text><text x="107" y="370" class="meta">workflow-run Conversation Nodes</text></g>

  <g filter="url(#shadow)"><rect class="card" x="348" y="128" width="226" height="146" rx="14"/><text x="372" y="158" class="eyebrow">BROWSER PROJECTION</text><text x="372" y="182" class="title">Small hidden Team snapshots</text><text x="372" y="205" class="meta">latest member and task revision</text><text x="372" y="225" class="meta">message / delivery matching</text><text x="372" y="245" class="meta">text-only message preview</text><circle cx="543" cy="154" r="5" fill="#43c982"/></g>

  <g filter="url(#shadow)"><rect class="card" x="642" y="128" width="242" height="146" rx="14"/><text x="666" y="158" class="eyebrow">MULTI-EDGE GRAPH MODEL</text><text x="666" y="182" class="title">Normalize, fold, and layer</text><text x="666" y="205" class="meta">task dependency · assignment</text><text x="666" y="225" class="meta">workflow grouping · navigation</text><text x="666" y="245" class="meta">communication overlay · stable DAG</text></g>

  <g filter="url(#shadow)"><rect x="946" y="128" width="216" height="146" rx="14" fill="#f3f5f7"/><text x="970" y="158" fill="#4f6fd8" font-size="9" font-weight="750" letter-spacing="1.1">DSH WEB SLOT</text><text x="970" y="184" fill="#17191d" font-size="15" font-weight="700">Three reactive views</text><g transform="translate(970 204)"><rect width="54" height="24" rx="7" fill="#e3e7ec"/><text x="27" y="16" text-anchor="middle" fill="#5d636c" font-size="9">Overview</text><rect x="60" width="67" height="24" rx="7" fill="#17191d"/><text x="93" y="16" text-anchor="middle" fill="#fff" font-size="9">Teams</text><rect x="133" width="59" height="24" rx="7" fill="#e3e7ec"/><text x="162" y="16" text-anchor="middle" fill="#5d636c" font-size="9">Workflow</text></g><text x="970" y="252" fill="#6f757e" font-size="11">conversation.session.header.actions</text></g>

  <g transform="translate(348 324)"><rect width="536" height="38" rx="19" fill="#1a1d22" stroke="#343941"/><circle cx="21" cy="19" r="4" fill="#7f9cff"/><text x="35" y="23" class="meta">Client only</text><circle cx="139" cy="19" r="4" fill="#43c982"/><text x="153" y="23" class="meta">Durable replay</text><circle cx="280" cy="19" r="4" fill="#43c982"/><text x="294" y="23" class="meta">No polling</text><circle cx="389" cy="19" r="4" fill="#43c982"/><text x="403" y="23" class="meta">Lifecycle owned</text></g>
</svg>
