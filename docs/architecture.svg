<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">dsh-task-dag client architecture</title>
  <desc id="desc">Session snapshots and durable workflow projections are combined into a graph model, laid out, and rendered in the DSH Web Session header slot.</desc>
  <style>
    :root { --bg:#f7f8fa; --surface:#ffffff; --surface-2:#f1f3f5; --border:#dfe2e5; --line:#b9bec5; --text:#17191c; --muted:#747a82; --blue:#4b75ff; --blue-soft:#e9efff; --green:#20b26b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#17191c; --surface:#23262a; --surface-2:#2b2e33; --border:#383c42; --line:#5a6069; --text:#f2f3f5; --muted:#a8adb5; --blue:#6f91ff; --blue-soft:#27345c; --green:#43c982; } }
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { fill:var(--text); font-size:15px; font-weight:650; }
    .meta { fill:var(--muted); font-size:12px; }
    .eyebrow { fill:var(--blue); font-size:10px; font-weight:750; letter-spacing:1.2px; }
    .card { fill:var(--surface); stroke:var(--border); stroke-width:1.2; }
    .arrow { fill:none; stroke:var(--line); stroke-width:1.7; }
    [fill="var(--bg)"] { fill:#101216; } [stroke="var(--bg)"] { stroke:#101216; }
    [fill="var(--surface)"] { fill:#1a1d22; } [stroke="var(--surface)"] { stroke:#1a1d22; }
    [fill="var(--surface-2)"] { fill:#22262c; }
    [fill="var(--border)"] { fill:#2b3038; } [stroke="var(--border)"] { stroke:#2b3038; }
    [fill="var(--line)"] { fill:#46505c; } [stroke="var(--line)"] { stroke:#46505c; }
    [fill="var(--text)"] { fill:#f4f6f8; } [stroke="var(--text)"] { stroke:#f4f6f8; }
    [fill="var(--muted)"] { fill:#9da5af; } [stroke="var(--muted)"] { stroke:#9da5af; }
    [fill="var(--blue)"] { fill:#5f82ff; } [stroke="var(--blue)"] { stroke:#5f82ff; }
    [fill="var(--blue-soft)"] { fill:#253156; }
    [fill="var(--green)"] { fill:#38c780; } [stroke="var(--green)"] { stroke:#38c780; }
    .title { fill:#f4f6f8; } .meta { fill:#9da5af; } .eyebrow { fill:#5f82ff; }
    .card { fill:#1a1d22; stroke:#2b3038; } .arrow { stroke:#46505c; }
  </style>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="var(--border)" opacity=".55"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4.5 0 9Z" fill="var(--line)"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000000" flood-opacity=".07"/></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="var(--bg)" stroke="var(--border)"/>
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="url(#dots)" opacity=".6"/>

  <text x="42" y="46" fill="var(--text)" font-size="18" font-weight="700">Projection-driven architecture</text>
  <text x="42" y="67" class="meta">Live Client state in, owned graph model out. No polling and no persisted mirror.</text>

  <path class="arrow" marker-end="url(#arrow)" d="M292 137C345 137 339 177 382 177"/>
  <path class="arrow" marker-end="url(#arrow)" d="M292 257C345 257 339 217 382 217"/>
  <path class="arrow" marker-end="url(#arrow)" d="M622 197H692"/>
  <path class="arrow" marker-end="url(#arrow)" d="M902 197H972"/>

  <g filter="url(#shadow)">
    <rect class="card" x="42" y="97" width="250" height="80" rx="12"/>
    <rect x="58" y="113" width="40" height="40" rx="10" fill="var(--surface-2)"/>
    <path d="M68 124h20M68 132h20M68 140h12" stroke="var(--muted)" stroke-width="1.7" stroke-linecap="round"/>
    <text x="112" y="124" class="eyebrow">SESSION SNAPSHOTS</text>
    <text x="112" y="147" class="title">Lineage and activity</text>
    <text x="112" y="164" class="meta">byId · parentId · catalogs</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="42" y="217" width="250" height="80" rx="12"/>
    <rect x="58" y="233" width="40" height="40" rx="10" fill="var(--blue-soft)"/>
    <path d="M78 240v9M68 264v-9h20v9" fill="none" stroke="var(--blue)" stroke-width="1.8" stroke-linecap="round"/><circle cx="78" cy="240" r="3" fill="none" stroke="var(--blue)" stroke-width="1.6"/>
    <text x="112" y="244" class="eyebrow">DURABLE WORKFLOWS</text>
    <text x="112" y="267" class="title">Phases and members</text>
    <text x="112" y="284" class="meta">workflow-run Conversation Nodes</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="382" y="137" width="240" height="120" rx="14"/>
    <text x="406" y="168" class="eyebrow">GRAPH PROJECTION</text>
    <text x="406" y="194" class="title">Normalize and group</text>
    <text x="406" y="217" class="meta">lineage · workflow ownership</text>
    <text x="406" y="237" class="meta">status · navigation capability</text>
    <circle cx="591" cy="164" r="5" fill="var(--green)"/>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="692" y="137" width="210" height="120" rx="14"/>
    <text x="716" y="168" class="eyebrow">DAG LAYOUT</text>
    <text x="716" y="194" class="title">Top-to-bottom SVG</text>
    <text x="716" y="217" class="meta">stable layers · curved edges</text>
    <text x="716" y="237" class="meta">fit · center · keyboard</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="972" y="137" width="186" height="120" rx="14" fill="var(--text)"/>
    <rect x="992" y="157" width="34" height="34" rx="9" fill="var(--bg)" opacity=".14"/>
    <path d="M1009 164v7M1001 184v-7h16v7" fill="none" stroke="var(--bg)" stroke-width="1.6" stroke-linecap="round"/>
    <text x="1038" y="172" fill="var(--bg)" font-size="10" font-weight="750" letter-spacing="1.1">DSH WEB SLOT</text>
    <text x="992" y="216" fill="var(--bg)" font-size="15" font-weight="650">Session header</text>
    <text x="992" y="237" fill="var(--bg)" opacity=".66" font-size="12">reactive modal surface</text>
  </g>

  <g transform="translate(382 297)"><rect width="520" height="34" rx="17" fill="var(--surface)" stroke="var(--border)"/><circle cx="20" cy="17" r="4" fill="var(--blue)"/><text x="34" y="21" class="meta">Client-only</text><circle cx="135" cy="17" r="4" fill="var(--green)"/><text x="149" y="21" class="meta">No Host polling</text><circle cx="276" cy="17" r="4" fill="var(--green)"/><text x="290" y="21" class="meta">No content persistence</text><circle cx="438" cy="17" r="4" fill="var(--green)"/><text x="452" y="21" class="meta">Lifecycle-owned</text></g>
</svg>
